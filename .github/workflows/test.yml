name: NEUROX CORE V6 — Python and JavaScript tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight reference API dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Python API client and reference server unit tests (offline)
        run: python -m unittest discover -s tests_python -v
      - name: Compile Python utilities
        run: python -m compileall -q python tests_python scripts

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run JavaScript unit tests
        run: node --test tests/*.test.mjs
